name: PHP CI

on:
  push:
    branches: [ci-testing]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pdo, pdo_sqlite, zip
          coverage: none

      - name: Install Composer
        run: composer install --no-interaction --prefer-dist

      - name: Run Tests
        run: composer test
