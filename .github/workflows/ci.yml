name: PHP CI

on:
  push:
    branches: [ci-testing]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DB_HOST: 127.0.0.1
      DB_NAME: timeclock
      DB_USER: root
      DB_PASS: root

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: timeclock
        ports:
          - 3306:3306

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pdo, pdo_mysql, curl, zip
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Initialize Database
        run: mysql -h 127.0.0.1 -P 3306 -u root -proot timeclock < db.sql

      - name: Create config.php
        run: |
          cat > config.php <<'PHP'
          <?php

          $pdo = new PDO(
              "mysql:host=" . getenv('DB_HOST') .
              ";dbname=" . getenv('DB_NAME') .
              ";charset=utf8mb4",
              getenv('DB_USER'),
              getenv('DB_PASS')
          );

          $pdo->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);
          PHP

      - name: Start PHP Server
        run: php -S 127.0.0.1:8000 > php-server.log 2>&1 &

      - name: Wait for PHP Server
        run: |
          for i in {1..10}; do
            if curl --silent --fail http://127.0.0.1:8000/create_user.php > /dev/null; then
              echo "PHP server is ready."
              exit 0
            fi
            sleep 1
          done

          echo "PHP server failed to start."
          cat php-server.log
          exit 1

      - name: Run Tests
        run: composer test
