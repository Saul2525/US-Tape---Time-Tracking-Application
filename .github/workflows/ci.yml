name: PHP CI

on:
  push:
    branches: [ci-testing]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DB_HOST: 127.0.0.1
      DB_NAME: timeclock_test
      DB_USER: root
      DB_PASS: ""

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ""
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: timeclock_test
        ports:
          - 3306:3306

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pdo, pdo_mysql, curl, zip
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping \
              -h "$DB_HOST" \
              -P 3306 \
              -u "$DB_USER" \
              --silent; then
              echo "MySQL is ready."
              exit 0
            fi

            echo "Waiting for MySQL..."
            sleep 2
          done

          echo "MySQL failed to start."
          exit 1

      - name: Initialize Database
        run: mysql -h "$DB_HOST" -P 3306 -u "$DB_USER" "$DB_NAME" < db.sql

      - name: Create config.php
        run: |
          cat > config.php <<'PHP'
          <?php

          $dbHost = getenv('DB_HOST') ?: '127.0.0.1';
          $dbName = getenv('DB_NAME') ?: 'timeclock';
          $dbUser = getenv('DB_USER') ?: 'root';
          $dbPass = getenv('DB_PASS') ?: '';

          $pdo = new PDO(
              "mysql:host={$dbHost};port=3306;dbname={$dbName};charset=utf8mb4",
              $dbUser,
              $dbPass
          );

          $pdo->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);
          PHP

      - name: Start PHP Server
        run: php -S 127.0.0.1:8001 > php-server.log 2>&1 &

      - name: Wait for PHP Server
        run: |
          for i in {1..10}; do
            if curl --silent --fail http://127.0.0.1:8001/index.php > /dev/null; then
              echo "PHP server is ready."
              exit 0
            fi

            echo "Waiting for PHP server..."
            sleep 1
          done

          echo "PHP server failed to start."
          cat php-server.log
          exit 1

      - name: Run Tests
        run: composer test
